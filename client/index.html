<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alina Photographer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <!-- ✅ ТЕМА СТАВИТЬСЯ ДО React (і light, і dark) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme"); // "light" або "dark" або null

          // fallback: системна тема (особливо важливо для мобільного/WhatsApp браузера)
          var systemPrefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;

          var theme = saved || (systemPrefersDark ? "dark" : "light");

          // ставимо класи явно
          var isLight = theme === "light";
          document.documentElement.classList.toggle("light", isLight);
          document.documentElement.classList.toggle("dark", !isLight);

          // щоб нативні елементи (інпути/скролбар) теж були ок
          document.documentElement.style.colorScheme = isLight ? "light" : "dark";

          // на випадок, якщо стилі в тебе прив’язані до body
          document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.toggle("light", isLight);
            document.body.classList.toggle("dark", !isLight);
          });
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
