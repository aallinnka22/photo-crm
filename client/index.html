<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alina Photographer</title>

    <!-- optional, але корисно для мобільного UI -->
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <!-- 🔥 FIX: тема ставиться ДО React -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem("theme") || "dark";
          const isLight = theme === "light";

          // важливо: ставимо клас на html одразу
          document.documentElement.classList.toggle("light", isLight);

          // і на body теж (деякі стилі можуть бути прив’язані до body.light)
          // якщо body ще нема — поставимо як тільки з’явиться
          const applyBody = () => document.body && document.body.classList.toggle("light", isLight);
          if (document.body) applyBody();
          else document.addEventListener("DOMContentLoaded", applyBody, { once: true });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
