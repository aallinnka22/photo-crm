<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alina Photographer</title>

    <!-- щоб браузер коректно малював темні контролли/скрол/бар -->
    <meta name="color-scheme" content="dark light" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Manrope:wght@300..800&display=swap"
      rel="stylesheet"
    />

    <!-- 🔥 ФІКС: тема ставиться ДО React (і на html, і на body) -->
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("theme");
          if (theme !== "light" && theme !== "dark") theme = "dark"; // дефолт темна

          var root = document.documentElement;

          // прибрати старі класи (на випадок кешу/старого коду)
          root.classList.remove("light", "dark");
          root.classList.add(theme);

          // ще й на body (бо інколи CSS написаний під body.light/body.dark)
          document.addEventListener("DOMContentLoaded", function () {
            document.body.classList.remove("light", "dark");
            document.body.classList.add(theme);
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
